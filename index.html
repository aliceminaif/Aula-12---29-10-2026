<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <title>EsToDoList</title>
</head>

<body class="bg-blue-50 text-slate-800">

    <header class="bg-white border-b-4 border-blue-600 p-4 text-center">
        <h1 class="text-3xl font-bold text-blue-600">EsToDoList</h1>
    </header>

    <main class="max-w-6xl mx-auto p-4 lg:grid lg:grid-cols-3 gap-6">


        <div class="col-span-1 space-y-4">
            <section class="bg-white border-2 border-blue-600 rounded-xl p-4 lg:col-span-1">
                <h2 class="text-xl font-bold text-blue-600">Bem-vinda, Alice!</h2>
            </section>

            <input type="text" placeholder="Pesquisar tarefa"
                class="w-full bg-white border-2 border-blue-600 rounded-xl p-3 font-semibold outline-none">

            <button class="w-full bg-blue-600 text-white font-semibold rounded-xl p-3 hover:bg-blue-700">
                Adicionar nova tarefa +
            </button>
        </div>




        <ul class="space-y-3 lg:col-span-2 ">

            <h2 class="text-xl font-bold text-blue-600">Próximas tarefas</h2>

            <li class="bg-white rounded-xl border border-blue-100 p-4 flex items-center justify-between gap-3">
                <label class="flex items-center gap-3">
                    <input type="checkbox" class="w-5 h-5">
                    <div>
                        <p class="font-semibold">Trabalho de História</p>
                        <p class="text-sm text-slate-500">Entrega: 20/10/2026</p>
                    </div>
                </label>
                <div class="flex gap-2">
                    <button
                        class="bg-amber-100 text-amber-800 rounded-md px-3 py-1 text-sm hover:bg-amber-200">Editar</button>
                    <button
                        class="bg-red-100 text-red-700 rounded-md px-3 py-1 text-sm hover:bg-red-200">Excluir</button>
                </div>
            </li>

            <li class="bg-white rounded-xl border border-blue-100 p-4 flex items-center justify-between gap-3">
                <label class="flex items-center gap-3">
                    <input type="checkbox" class="w-5 h-5">
                    <div>
                        <p class="font-semibold">Lista de exercícios de Matemática</p>
                        <p class="text-sm text-slate-500">Entrega: 22/10/2026</p>
                    </div>
                </label>
                <div class="flex gap-2">
                    <button
                        class="bg-amber-100 text-amber-800 rounded-md px-3 py-1 text-sm hover:bg-amber-200">Editar</button>
                    <button
                        class="bg-red-100 text-red-700 rounded-md px-3 py-1 text-sm hover:bg-red-200">Excluir</button>
                </div>
            </li>

            <li class="bg-white rounded-xl border border-blue-100 p-4 flex items-center justify-between gap-3">
                <label class="flex items-center gap-3">
                    <input type="checkbox" checked class="w-5 h-5">
                    <div class="line-through text-slate-400">
                        <p class="font-semibold">Resumo do livro de Português</p>
                        <p class="text-sm">Entrega: 25/10/2026</p>
                    </div>
                </label>
                <div class="flex gap-2">
                    <button
                        class="bg-amber-100 text-amber-800 rounded-md px-3 py-1 text-sm hover:bg-amber-200">Editar</button>
                    <button
                        class="bg-red-100 text-red-700 rounded-md px-3 py-1 text-sm hover:bg-red-200">Excluir</button>
                </div>
            </li>

        </ul>
    </main>

</body>

</html>
